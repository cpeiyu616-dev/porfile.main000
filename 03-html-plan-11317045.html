<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紙橋挑戰社:活動準備頁</title>
  <!-- 老師預先提供表格框線，方便辨認儲存格；本活動不用修改 CSS。 -->
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #777; padding: 8px; text-align: left; }
    caption { text-align: left; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>紙橋挑戰社:活動準備頁</h1>
  <p>我是陳姵宇，這學期想把自己的點子做成可以分享的作品。</p>

  <h2>要帶的材料</h2>
  <ul>
    <ul>A3紙3張</ul>
    <ul>膠帶1卷</ul>
    <ul>積木10個</ul>
  </ul>

  <h2>挑戰步驟</h2>
  <ol>
    <ol>先畫出紙橋草圖</ol>
    <ol>再拆出橋面並固定</ol>
    <ol>逐一放上積木，觀察能承受的重量</ol>
    <ol>紀錄結果，討論如何改進</ol>
  </ol>

  <h2>小組分工</h2>
  <table>
    <caption>技能與成果對照</caption>
    <thead>
      <tr>
        <th scope="col">設計員</th>
        <th scope="col">製作員</th>
        <th scope="col">紀錄員</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>畫出紙橋草圖</td>
        <td>依照草圖組裝</td>
        <td>紀錄測試結果</td>
      </tr>
      <tr>
        <td>預計成果是一張草圖</td>
        <td>預計成果是一座紙橋</td>
        <td>預計成果是一份測試作業</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
