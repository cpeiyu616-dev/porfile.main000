<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紙橋挑戰社:活動準備頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="homework.html" class="nav-back">&larr; 返回作業列表</a>

  <h1>紙橋挑戰社:活動準備頁</h1>
  <p>我是陳姵宇，這學期想把自己的點子做成可以分享的作品。</p>

  <h2>要帶的材料</h2>
  <ul>
    <li>A3紙3張</li>
    <li>膠帶1卷</li>
    <li>積木10個</li>
  </ul>

  <h2>挑戰步驟</h2>
  <ol>
    <li>先畫出紙橋草圖</li>
    <li>再拆出橋面並固定</li>
    <li>逐一放上積木，觀察能承受的重量</li>
    <li>紀錄結果，討論如何改進</li>
  </ol>

  <h2>小組分工</h2>
  <table>
    <caption>技能與成果對照</caption>
    <thead>
      <tr>
        <th scope="col">角色名稱</th>
        <th scope="col">負責分工</th>
        <th scope="col">預計成果</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>設計員</td>
        <td>畫出紙橋草圖</td>
        <td>預計成果是一張草圖</td>
      </tr>
      <tr>
        <td>製作員</td>
        <td>依照草圖組裝</td>
        <td>預計成果是一座紙橋</td>
      </tr>
      <tr>
        <td>紀錄員</td>
        <td>紀錄測試結果</td>
        <td>預計成果是一份測試作業</td>
      </tr>
      <tr>
        <td>測試員</td>
        <td>逐一加載積木進行承重測試</td>
        <td>預計成果是一份承重數據與紀錄表</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
