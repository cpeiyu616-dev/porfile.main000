<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動 02：多媒體應用</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .worksheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .task-badge {
      display: inline-block;
      background: var(--color-primary);
      color: var(--bg-dark);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      align-self: flex-start;
    }

    .task-card h2 {
      font-size: 1.2rem;
      color: #ffffff;
      margin: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .task-card img, .task-card audio, .task-card video {
      width: 100%;
      border-radius: 8px;
    }

    .task-card img {
      height: auto;
      border: 1px solid var(--border-color);
    }

    .task-card p {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }

    .task-card.full-width {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
      <a href="homework.html" style="color: var(--color-primary); text-decoration: none; font-size: 0.9rem;">&larr; 返回作業列表</a>
      <h1 style="margin-top: 15px; font-size: 2.2rem; color: #ffffff;">活動 02：多媒體應用</h1>
      <p style="color: var(--color-primary); font-size: 1.05rem; margin-top: 8px;">自然觀察任務卡</p>
    </header>

    <div class="worksheet-grid">
      
      <!-- 圖片卡片 -->
      <div class="task-card">
        <span class="task-badge">TASK 01</span>
        <h2>觀察任務 1：圖片觀察</h2>
        <img src="media-02/leaf-photo.png" alt="自然觀察圖片">
        <p>觀察重點：記錄觀察到的物種名稱與特徵。</p>
      </div>

      <!-- 音訊卡片 -->
      <div class="task-card">
        <span class="task-badge">TASK 02</span>
        <h2>觀察任務 2：聲音紀錄</h2>
        <audio controls src="media-02/notice.wav"></audio>
        <p>聆聽重點：記錄環境中的自然聲音與環境變化。</p>
      </div>

      <!-- 影片卡片 -->
      <div class="task-card full-width">
        <span class="task-badge">TASK 03</span>
        <h2>觀察任務 3：影片紀錄</h2>
        <video controls src="media-02/flower.mp4"></video>
        <p>影像紀錄：記錄生物活動與動態行為。</p>
      </div>

    </div>

    <footer style="margin-top: 60px; text-align: center; color: var(--text-sub); font-size: 0.85rem; padding-top: 20px; border-top: 1px solid var(--border-color);">
      <p>&copy; 2026 陳姵宇. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
