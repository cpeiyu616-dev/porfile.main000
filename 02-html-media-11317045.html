<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動 02：多媒體應用 | 自然觀察任務卡</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .media-card h3 {
            font-size: 1.1rem;
            color: var(--color-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .media-card img, 
        .media-card video {
            width: 100%;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
        }

        .media-card audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
            <a href="homework.html" style="color: var(--color-primary); text-decoration: none; font-size: 0.9rem;">&larr; 返回作業列表</a>
            <h1 style="margin-top: 15px;">活動 02：多媒體應用 (自然觀察任務卡)</h1>
        </header>

        <div class="media-grid">
            <!-- 圖片區塊 -->
            <div class="media-card">
                <h3>📷 觀察物件照片</h3>
                <img src="https://picsum.photos/600/400" alt="自然觀察物件">
                <p style="font-size: 0.85rem; color: var(--text-sub);">紀錄於校園生態池畔的自然植物細部結構。</p>
            </div>

            <!-- 音訊區塊 -->
            <div class="media-card">
                <h3>🎵 環境音效紀錄</h3>
                <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                    <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px;">現場鳥鳴與水流聲錄音：</p>
                    <audio controls>
                        <source src="" type="audio/mpeg">
                        您的瀏覽器不支援音訊播放器。
                    </audio>
                </div>
            </div>

            <!-- 影片區塊 -->
            <div class="media-card" style="grid-column: 1 / -1;">
                <h3>🎬 動態觀察影片</h3>
                <video controls poster="https://picsum.photos/800/450">
                    <source src="" type="video/mp4">
                    您的瀏覽器不支援影片播放器。
                </video>
                <p style="font-size: 0.85rem; color: var(--text-sub);">短片紀錄：生物於自然環境中的移動與互動姿態。</p>
            </div>
        </div>
    </div>
</body>
</html>
