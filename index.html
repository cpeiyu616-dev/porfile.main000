<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳姵宇 Peiyu Chen | 個人作品集</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0a0a0c;
            background-image: radial-gradient(circle at 50% 0%, #16161a 0%, #0a0a0c 70%);
            color: #e4e4e7;
            line-height: 1.6;
            padding: 50px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 標題置中放大 */
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.05em;
        }

        /* 核心二分版面 */
        .portfolio-wrapper {
            display: flex;
            gap: 48px;
            align-items: flex-start;
        }

        /* 左側：證件照 + 細長型簡介 */
        .left-sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 個人照片（證件照尺寸，無微光，極簡風格） */
        .photo-box {
            width: 150px;
            height: 190px;
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #71717a;
            font-size: 0.85rem;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* 個人簡介（細長型長方形） */
        .about-box {
            width: 100%;
            background: #141418;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 28px 20px;
            min-height: 380px; /* 拉長為細長型 */
        }

        .about-box h2 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
            font-weight: 600;
            border-left: 2px solid #e4e4e7;
            padding-left: 10px;
        }

        .about-content {
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        /* 右側作品集：兩欄式錯位排版 */
        .right-portfolio {
            flex-grow: 1;
            display: flex;
            gap: 24px;
        }

        .portfolio-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* 右欄向下滑動，創造高低錯位感 */
        .portfolio-col.right-col {
            margin-top: 50px;
        }

        /* 作品卡片基礎（深色極簡層次） */
        .work-card {
            background: #141418;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .work-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: #18181c;
        }

        .tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 4px;
            margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #a1a1aa;
            letter-spacing: 0.05em;
        }

        .work-title {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .work-desc {
            color: #71717a;
            font-size: 0.88rem;
        }

        /* 不同尺寸卡片：長方形與正方形穿插 */
        .card-rect-short {
            min-height: 180px;
        }

        .card-square {
            min-height: 240px;
        }

        /* 大二核心作品：較大的長方形卡片 */
        .card-sophomore {
            min-height: 320px;
            background: #1a1a20;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .card-sophomore .tag {
            background: #ffffff;
            color: #0a0a0c;
            font-weight: 700;
        }

        .card-sophomore .work-title {
            font-size: 1.4rem;
        }

        footer {
            margin-top: 90px;
            text-align: center;
            color: #52525b;
            font-size: 0.85rem;
        }

        /* 響應式 */
        @media (max-width: 820px) {
            .portfolio-wrapper {
                flex-direction: column;
            }
            .left-sidebar {
                width: 100%;
            }
            .right-portfolio {
                flex-direction: column;
            }
            .portfolio-col.right-col {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 名字置中與放大 -->
        <header>
            <h1>陳姵宇 Peiyu Chen</h1>
        </header>

        <!-- 主體版面 -->
        <div class="portfolio-wrapper">
            
            <!-- 左欄：證件照 + 細長型簡介 -->
            <div class="left-sidebar">
                <!-- 證件照大小，極簡風 -->
                <div class="photo-box">
                    <p>📷 證件照空間</p>
                    <img src="" alt="個人照片">
                </div>

                <!-- 長方形細長簡介區 -->
                <div class="about-box">
                    <h2>個人簡介</h2>
                    <div class="about-content">
                        <!-- 可在此填入簡介內容 -->
                    </div>
                </div>
            </div>

            <!-- 右欄：作品集（左右兩欄高低錯位、黑灰色階層次、正方形/長方形穿插） -->
            <div class="right-portfolio">

                <!-- 左側縱向欄位 -->
                <div class="portfolio-col left-col">
                    
                    <!-- 大一作品（一般長方形） -->
                    <div class="work-card card-rect-short">
                        <span class="tag">大一作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>

                    <!-- 大二核心作品（大尺寸長方形，顯眼突出） -->
                    <div class="work-card card-sophomore">
                        <span class="tag">FEATURED · 大二核心作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>

                </div>

                <!-- 右側縱向欄位（向下滑動錯位） -->
                <div class="portfolio-col right-col">
                    
                    <!-- 大三作品（正方形感卡片） -->
                    <div class="work-card card-square">
                        <span class="tag">大三作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>

                    <!-- 大四作品（短長方形卡片） -->
                    <div class="work-card card-rect-short">
                        <span class="tag">大四作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>

                </div>

            </div>

        </div>

        <footer>
            <p>&copy; 2026 陳姵宇. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
