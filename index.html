<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳姵宇 Peiyu Chen | 個人作品集</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0c0f17;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #e2e8f0;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .portfolio-wrapper {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .left-sidebar {
            width: 320px;
            flex-shrink: 0;
        }

        .photo-box {
            width: 100%;
            height: 320px;
            background: rgba(18, 24, 38, 0.8);
            border: 2px solid rgba(99, 102, 241, 0.6);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #818cf8;
            font-size: 1rem;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }

        .about-box {
            margin-top: 40px;
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
        }

        .about-box h2 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .about-content {
            color: #94a3b8;
            font-size: 0.95rem;
            min-height: 100px;
        }

        .right-portfolio {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .portfolio-row {
            display: flex;
            gap: 20px;
        }

        .work-card {
            flex: 1;
            background: linear-gradient(145deg, rgba(20, 26, 40, 0.9) 0%, rgba(13, 17, 26, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-height: 160px;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .work-card.sophomore-featured {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(129, 140, 248, 0.6);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.25);
            padding: 32px;
            min-height: 220px;
        }

        .work-card.sophomore-featured .tag {
            background: #6366f1;
            color: #ffffff;
            border: none;
        }

        .work-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .work-desc {
            color: #64748b;
            font-size: 0.92rem;
        }

        .offset-card {
            margin-top: 30px;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
        }

        @media (max-width: 800px) {
            .portfolio-wrapper {
                flex-direction: column;
            }
            .left-sidebar {
                width: 100%;
            }
            .portfolio-row {
                flex-direction: column;
            }
            .offset-card {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>陳姵宇 Peiyu Chen</h1>
        </header>

        <div class="portfolio-wrapper">
            
            <div class="left-sidebar">
                <div class="photo-box">
                    <p>📷 [個人照片空間]</p>
                </div>

                <div class="about-box">
                    <h2>個人簡介</h2>
                    <div class="about-content">
                    </div>
                </div>
            </div>

            <div class="right-portfolio">

                <div class="portfolio-row">
                    <div class="work-card">
                        <span class="tag">大一作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>
                </div>

                <div class="portfolio-row">
                    <div class="work-card sophomore-featured">
                        <span class="tag">大二核心作品 (FEATURED)</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>
                </div>

                <div class="portfolio-row">
                    <div class="work-card offset-card">
                        <span class="tag">大三作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>

                    <div class="work-card">
                        <span class="tag">大四作品</span>
                        <h3 class="work-title"></h3>
                        <div class="work-desc"></div>
                    </div>
                </div>

            </div>

        </div>

        <footer>
            <p>&copy; 2026 陳姵宇. All rights reserved.</p>
        </footer>
    </div>
