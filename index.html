<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳姵宇 Peiyu Chen | 個人作品集</title>
    <style>
        /* Base & CSS Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #0a0d14;
            --bg-card: rgba(18, 24, 38, 0.6);
            --bg-card-hover: rgba(28, 36, 56, 0.8);
            --border-glow: rgba(99, 102, 241, 0.2);
            --border-light: rgba(255, 255, 255, 0.08);
            --accent-blue: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #4b5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            /* 設計感背景：微光點陣與雙色漸層暈染 */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header Style */
        header {
            text-align: left;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        header .title-area h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header .title-area p {
            color: var(--text-sub);
            font-size: 1rem;
            margin-top: 4px;
        }

        /* Main Layout Grid: 左欄（頭像與簡介） + 右欄（錯位作品集） */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 32px;
        }

        /* Left Column: Profile & About */
        .left-column {
            display: flex;
            flex-direction: column;
        }

        /* 個人照預留區 */
        .profile-photo-container {
            width: 100%;
            height: 280px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed var(--border-glow);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .profile-photo-container:hover {
            border-color: var(--accent-blue);
            background: rgba(99, 102, 241, 0.05);
        }

        .profile-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
            display: none; /* 當你放入圖片網址時改為 block */
        }

        .photo-placeholder-text {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            padding: 0 15px;
        }

        /* 個人簡介區（與頭像保持距離） */
        .about-section {
            margin-top: 40px; /* 正下方拉開距離 */
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
        }

        .about-section h2 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .about-section h2::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
        }

        .about-placeholder {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.7;
            min-height: 120px;
        }

        /* Right Column: 錯位作品集排版 */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;
        }

        /* 作品通用卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            background: var(--bg-card-hover);
        }

        .card-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid var(--border-light);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-body {
            color: var(--text-sub);
            font-size: 0.9rem;
            min-height: 80px;
        }

        /* 大二專屬：最大主打卡片 */
        .card.featured {
            grid-column: span 2; /* 橫跨兩欄 */
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.5) 0%, rgba(15, 23, 42, 0.7) 100%);
            border: 1px solid rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
            padding: 32px;
        }

        .card.featured .card-tag {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
        }

        .card.featured .card-title {
            font-size: 1.5rem;
            color: #ffffff;
        }

        .card.featured .card-body {
            min-height: 120px;
            font-size: 0.98rem;
        }

        /* 錯位對齊視覺效果 (Masonry Offset) */
        .card.offset-down {
            margin-top: 30px; /* 創造高低錯位感 */
        }

        /* Footer */
        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        /* Responsive Design */
        @media (max-width: 868px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
            .card.featured {
                grid-column: span 1;
            }
            .card.offset-down {
                margin-top: 0;
            }
        }
    </style>
</head>
