<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳姵宇 Peiyu Chen | 個人作品集</title>
    <style>
        /* CSS Reset & Variables */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* 調整底色與卡片顏色的對比 */
            --bg-body: #08080a;           /* 極致深黑背景 */
            --bg-card: rgba(255, 255, 255, 0.04); /* 半透明白 */
            --bg-card-feat: rgba(255, 255, 255, 0.08); /* 焦點卡片，稍亮 */
            --border-light: rgba(255, 255, 255, 0.12); /* 框線更細緻半透明 */
            --text-main: #f4f4f5;         /* 冷白文字 */
            --text-sub: #a1a1aa;          /* 次要灰字 */
            --accent-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% -20%, #1a1a22 0%, var(--bg-body) 80%);
            color: var(--text-main);
            line-height: 1.6;
            padding: 60px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 標題：置中放大 */
        header {
            text-align: center;
            margin-bottom: 70px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-light);
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.05em;
        }

        /* 核心版面 */
        .portfolio-wrapper {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        /* 左側：照片在上面 */
        .left-sidebar {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* 個人照片 */
        .photo-box {
            width: 150px;
            height: 190px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #52525b;
            font-size: 0.8rem;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* 個人簡介 */
        .about-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 30px 24px;
            min-height: 400px; 
            backdrop-filter: blur(8px);
        }

        .about-box h2 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 16px;
            font-weight: 600;
            border-left: 2px solid #ffffff;
            padding-left: 12px;
        }

        .about-content {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* 右側作品集 */
        .right-portfolio {
            flex-grow: 1;
            display: flex;
            gap: 24px;
        }

        .portfolio-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* 右欄向下滑動錯位 */
        .portfolio-col.right-col {
            margin-top: 60px;
        }

        /* 作品卡片 (改為 <a> 標籤，去除預設底線並設為塊級元素) */
        .work-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 26px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .work-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #d4d4d8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .work-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .work-title .arrow {
            font-size: 1rem;
            transition: transform 0.3s ease;
            color: var(--text-sub);
        }

        .work-card:hover .work-title .arrow {
            transform: translateX(4px);
            color: #ffffff;
        }

        .work-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* 尺寸設定 */
        .card-rect-short { min-height: 180px; }
        .card-square { min-height: 250px; }

        /* 大二核心作品樣式 */
        .card-sophomore {
            min-height: 320px;
            background: var(--bg-card-feat);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .card-sophomore .tag {
            background: #ffffff;
            color: #000000;
        }

        .card-sophomore .work-title { font-size: 1.5rem; }
        .card-sophomore .work-desc { color: #d4d4d8; }

        footer {
            margin-top: 100px;
            text-align: center;
            color: #52525b;
            font-size: 0.85rem;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .portfolio-wrapper { flex-direction: column; }
            .left-sidebar { width: 100%; align-items: center; }
            .right-portfolio { flex-direction: column; }
            .portfolio-col.right-col { margin-top: 0; }
            .photo-box { align-self: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 名字：置中放大 -->
        <header>
            <h1>陳姵宇 Peiyu Chen</h1>
        </header>

        <!-- 主架構 -->
        <div class="portfolio-wrapper">
            
            <!-- 【左半邊】照片與簡介 -->
            <div class="left-sidebar">
                
                <!-- 證件照區域 -->
                <div class="photo-box">
                    <p>📷 證件照空間</p>
                    <img src="" alt="個人照片">
                </div>

                <!-- 個人簡介區 -->
                <div class="about-box">
                    <h2>個人簡介</h2>
                    <div class="about-content">
                        <!-- 可填入個人簡介 -->
                    </div>
                </div>
            </div>

            <!-- 【右半邊】作品集 -->
            <div class="right-portfolio">

                <!-- 左側縱向欄位 (含大一作業卡片、大二featured) -->
                <div class="portfolio-col left-col">
                    
                    <!-- 【大一區塊】數位科技概論作業卡片（點擊直接前往獨立作業頁面，非彈出視窗） -->
                    <a href="homework.html" class="work-card card-rect-short">
                        <span class="tag">FRESHMAN · 大一作品</span>
                        <h3 class="work-title">
                            數位科技概論作業
                            <span class="arrow">&rarr;</span>
                        </h3>
                        <div class="work-desc">包含 HTML 語意標籤、多媒體、清單表格與 CSS 視覺排版之細部作業列表。</div>
                    </a>

                    <!-- 大二核心作品 -->
                    <div class="work-card card-sophomore">
                        <span class="tag">FEATURED · 大二核心作品</span>
                        <h3 class="work-title">核心專案標題</h3>
                        <div class="work-desc">專案詳細說明與成果展示。</div>
                    </div>

                </div>

                <!-- 右側縱向欄位 (向下滑動錯位) -->
                <div class="portfolio-col right-col">
                    
                    <!-- 大三作品 -->
                    <div class="work-card card-square">
                        <span class="tag">JUNIOR · 大三作品</span>
                        <h3 class="work-title">跨領域整合專案</h3>
                        <div class="work-desc">大三進階視覺與互動設計作品。</div>
                    </div>

                    <!-- 大四作品 -->
                    <div class="work-card card-rect-short">
                        <span class="tag">SENIOR · 大四作品</span>
                        <h3 class="work-title">畢業設計作品集</h3>
                        <div class="work-desc">大四專題與綜合專案成果展現。</div>
                    </div>

                </div>

            </div>

        </div>

        <footer>
            <p>&copy; 2026 陳姵宇. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
