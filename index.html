        :root {

            padding: 60px 20px;
            min-height: 100vh;
        }

        .container {

        /* 左側：照片在上面 (已順序對調) */

            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* 個人照片 (證件照尺寸，對齊最左邊，無微光，移至最上方) */
        .photo-box {
            width: 150px;
            height: 190px;
            background: rgba(255, 255, 255, 0.01); /* 極致半透明 */
            border: 1px solid rgba(255, 255, 255, 0.2); /* 稍微明顯一點的白框 */

        .photo-box img {
            width: 100%;

        .portfolio-col.right-col {
            margin-top: 60px;
        }

            background: var(--bg-card); /* 半透明白 */
            border: 1px solid var(--border-light); /* 每個方框旁邊增加細白框 */
            border-radius: 14px;
            padding: 26px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px); /* 增加玻璃質感 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        /* 懸停效果：增加框線亮度和上浮，提升層次感 */
        .work-card:hover {

            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.08); /* 懸停時稍亮 */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .tag {

            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.1); /* 半透明白標籤 */
            color: #d4d4d8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .work-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .work-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .card-rect-short { min-height: 180px; }
        .card-square { min-height: 250px; }

        /* 大二核心作品：較亮的半透明背景，做出層次差異 */
        .card-sophomore {
            min-height: 320px;
            background: var(--bg-card-feat); /* 較亮半透明 */
            border: 1px solid rgba(255, 255, 255, 0.25); /* 框線更亮 */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03); /* 極微弱白色暈染 */
        }

        .card-sophomore .tag {
            background: #ffffff;
            color: #000000;
        }

        .card-sophomore .work-title { font-size: 1.5rem; }
        .card-sophomore .work-desc { color: #d4d4d8; }

        footer {
            margin-top: 100px;
            text-align: center;
            color: #52525b;
            font-size: 0.85rem;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .portfolio-wrapper { flex-direction: column; }
            .left-sidebar { width: 100%; align-items: center; }
            .right-portfolio { flex-direction: column; }
            .portfolio-col.right-col { margin-top: 0; }
            .photo-box { align-self: center; } /* 手機版照片置中 */
        }
