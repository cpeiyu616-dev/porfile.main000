        <main class="assignment-card" style="display: block; line-height: 1.8;">
            <h2 style="color: var(--color-primary); margin-bottom: 15px;">水與生活（Water and Life）</h2>
            
            <p style="margin-bottom: 15px;">
                水是地球上最寶貴的資源之一。化學式為 <strong>H<sub>2</sub>O</strong>，是由兩個氫原子與一個氧原子結合而成。
            </p>

            <h3 style="color: var(--text-main); margin: 25px 0 10px 0;">水的常見狀態與溫度：</h3>
            <ul style="margin-left: 20px; color: var(--text-sub); margin-bottom: 20px;">
                <li>冰的融點：0 <sup>o</sup>C</li>
                <li>水的沸點：100 <sup>o</sup>C</li>
            </ul>

            <h3 style="color: var(--text-main); margin: 25px 0 10px 0;">重要觀念：</h3>
            <p style="color: var(--text-sub);">
                珍惜水資源，從日常省水做起。水不僅維持人類生命，也是維持生態平衡不可或缺的要素。
            </p>
        </main>
